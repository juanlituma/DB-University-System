<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Management</title>
    <link rel="stylesheet" href="/static/style.css" />
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <main class="container">
      <h1>Student Management System</h1>

      <section class="card">
        <h2>Add a Student</h2>

        <form id="student-form">
          <label for="first_name">First Name</label>
          <input id="first_name" name="first_name" maxlength="50" required />

          <label for="last_name">Last Name</label>
          <input id="last_name" name="last_name" maxlength="50" required />

          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            maxlength="100"
            required
          />

          <button type="submit">Add Student</button>
        </form>
        <form id="edit-form" hidden>
          <h3>Edit Student</h3>

          <input type="hidden" id="edit-student-id" />

          <label for="edit-first-name">First Name</label>
          <input id="edit-first-name" maxlength="50" required />

          <label for="edit-last-name">Last Name</label>
          <input id="edit-last-name" maxlength="50" required />

          <label for="edit-email">Email</label>
          <input id="edit-email" type="email" maxlength="100" required />

          <button type="submit">Save Changes</button>
          <button type="button" id="cancel-edit">Cancel</button>
        </form>

        <p id="message" role="status"></p>
      </section>

      <section class="card">
        <h2>Existing Students</h2>

        <button id="refresh-button" type="button">Refresh List</button>

        <p id="loading-message">Loading students...</p>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Email</th>
                <th>Created At</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="students-table"></tbody>
          </table>
        </div>
      </section>
    </main>
  </body>
</html>
